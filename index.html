<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="NOVA - خاستگاه پیکسل‌های نئونی | تبدیل عکس به هنر دیجیتال با ۴ حالت خلق تصویر">
    <meta name="theme-color" content="#050508">
    <title>🌌 NOVA | خاستگاه پیکسل‌ها</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ستاره نئونی پس‌زمینه -->
    <div class="bg-star" aria-hidden="true"></div>

    <main class="container">
        <h1>NOVA</h1>
        <div class="subtitle">NEON PIXEL GENESIS</div>
        
        <!-- کادر آپلود عکس -->
        <label for="file-upload" class="upload-area" id="drop-zone">
            <p>برای انتخاب عکس کلیک کنید</p>
            <p class="upload-icon">🖼️</p>
        </label>
        <input id="file-upload" type="file" accept="image/*">

        <!-- انتخاب مود -->
        <div id="mode-selection">
            <div class="mode-title">حالت خلق تصویر را انتخاب کنید:</div>
            <div class="modes-grid">
                <button class="mode-btn active" data-mode="ripple" type="button">
                    <span class="icon">🌊</span>
                    <span>موج از مرکز</span>
                </button>
                <button class="mode-btn" data-mode="rain" type="button">
                    <span class="icon">🌧️</span>
                    <span>بارش ماتریکسی</span>
                </button>
                <button class="mode-btn" data-mode="spiral" type="button">
                    <span class="icon">🐍</span>
                    <span>مارپیچ مرموز</span>
                </button>
                <button class="mode-btn" data-mode="spectrum" type="button">
                    <span class="icon">🎨</span>
                    <span>لایه‌های رنگی</span>
                </button>
            </div>
        </div>

        <!-- دکمه شروع -->
        <button class="btn" id="start-btn" style="display: none;" type="button">شروع خلق</button>

        <!-- نوار پیشرفت -->
        <div class="progress-container" id="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-text" id="progress-text">آماده‌سازی...</div>
        </div>

        <!-- بوم نقاشی -->
        <div id="canvas-wrapper">
            <canvas id="draw-canvas"></canvas>
            <div class="recording-pulse" id="rec-pulse"></div>
        </div>

        <!-- دکمه دانلود -->
        <a href="#" id="download-link" class="btn" download="nova-art.webm">💾 دانلود ویدیو</a>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
